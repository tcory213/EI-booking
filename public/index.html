/* ============ HELPERS ============ */
// 以「本地時區」組出 YYYY-MM-DD，避免 toISOString() 轉成UTC造成日期偏移一天的問題
function toLocalISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return toLocalISODate(new Date()); }
// 以最近一次的週二為錨點，開放到「四週後的週二」為止（跟後端 dailySlotRefresh 邏輯一致）
function maxDateStr(){
  const now = new Date();
  const dow = now.getDay(); // 0=週日...2=週二...
  const daysSinceTuesday = (dow - 2 + 7) % 7;
  const d = new Date(now);
  d.setDate(d.getDate() - daysSinceTuesday + 28);
  return toLocalISODate(d);
}
function minBookableDateStr(){ const d=new Date(); d.setDate(d.getDate()+2); return toLocalISODate(d); }

function normPhone(p){ return (p||'').replace(/\D/g,''); }

function calcAge(birthStr){
  if(!birthStr) return null;
  const b = new Date(birthStr+'T00:00:00');
  const now = new Date();
  if(isNaN(b.getTime()) || b > now) return null;
  let years = now.getFullYear() - b.getFullYear();
  let months = now.getMonth() - b.getMonth();
  if(now.getDate() < b.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  return years+'歲'+months+'個月';
}

const AGE_LIMIT_MSG = '很抱歉由於健保政策規範，目前早療初評僅提供8歲半以下兒童。超過8歲半兒童建議尋求兒童身心科協助。';

function ageInMonths(birthStr){
  if(!birthStr) return null;
  const b = new Date(birthStr+'T00:00:00');
  const now = new Date();
  if(isNaN(b.getTime()) || b > now) return null;
  let years = now.getFullYear() - b.getFullYear();
  let months = now.getMonth() - b.getMonth();
  if(now.getDate() < b.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  return years*12 + months;
}
function isOverAgeLimit(birthStr){
  const m = ageInMonths(birthStr);
  return m !== null && m > 102;
}

function fmtDateChip(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = ['日','一','二','三','四','五','六'][d.getDay()];
  return { dow:'週'+dow, dnum:(d.getMonth()+1)+'/'+d.getDate() };
}
function fmtDateFull(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = ['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日（週'+dow+'）';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ STORAGE (Firestore: slots為公開集合, patients底下的bookings子集合為私密集合) ============ */

// 載入公開的時段列表（任何人都能讀取，不含病患個資）
async function loadSlots(){
  try{
    const snap = await db.collection('slots').get();
    slots = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }catch(e){ console.error(e); slots = []; }
}

// 判斷這個錯誤是不是因為「其實沒有登入/登入已失效」造成的
// （Firestore 規則要求已登入才能讀寫，沒登入時會回傳 permission-denied）
function isAuthError(e){
  return e && e.code === 'permission-denied';
}

// 登入已失效：跳出明確提示，並直接帶回登入畫面，不用使用者自己猜原因
async function handleAuthExpired(){
  showToast('登入已失效，請重新登入');
  try{ await auth.signOut(); }catch(e){ console.error(e); }
  state.view = 'patient';
  state.patientStep = 1;
  state.showAdminLogin = true;
  render();
}

// 後台專用：直接讀取 Firestore（已登入管理員才有權限，見 firestore.rules），
// 取回時段（含病患資料）、候補名單、固定時段停開清單，並在前端把資料 join 起來。
async function loadAdminDashboard(){
  try{
    const [slotsSnap, waitSnap, langWaitSnap, tplSnap, bookSnap] = await Promise.all([
      db.collection('slots').get(),
      db.collection('waitlist').get(),
      db.collection('languageWaitlist').get(),
      db.collection('templateMeta').doc('cancelledOcc').get(),
      db.collection('bookings').where('status','==','active').get(),
    ]);
    const bookingBySlot = {};
    bookSnap.docs.forEach(d=>{
      const b = d.data();
      bookingBySlot[b.slotId] = { ...b, _bookingId: d.id };
    });
    slots = slotsSnap.docs.map(d=>{
      const s = { id: d.id, ...d.data() };
      if(bookingBySlot[s.id]) s.booking = bookingBySlot[s.id];
      return s;
    });
    waitlist = waitSnap.docs.map(d=>({ id: d.id, ...d.data() }));
    languageWaitlist = langWaitSnap.docs.map(d=>({ id: d.id, ...d.data() }));
    cancelledOcc = (tplSnap.exists && tplSnap.data().list) ? tplSnap.data().list : [];
  }catch(e){
    console.error(e);
    if(isAuthError(e)){ await handleAuthExpired(); return; }
    showToast('讀取後台資料失敗，請確認已用管理員帳號登入');
  }
}

// 載入稽核紀錄（僅後台，用於萬一懷疑遭入侵時佐證來源IP／是否來自境外）
// 直接讀 Firestore（已登入管理員才有權限），不再經過 Cloud Function。
async function loadAuditLogs(){
  try{
    const snap = await db.collection('auditLogs').orderBy('ts','desc').limit(200).get();
    auditLogs = snap.docs.map(d=>({ id: d.id, ...d.data() }));
  }catch(e){
    console.error(e);
    if(isAuthError(e)){ await handleAuthExpired(); return; }
    showToast('讀取稽核紀錄失敗');
    auditLogs = [];
  }
}

function isWednesday(dateStr){
  return new Date(dateStr+'T00:00:00').getDay() === 3;
}
function applySlotFilter(list){
  if(state.slotFilter === 'wedOnly') return list.filter(s=>isWednesday(s.date));
  if(state.slotFilter === 'blocked') return [];
  // 預設 excludeWed：排除週三晚上的時段
  return list.filter(s=>!isWednesday(s.date));
}
function availableDates(){
  const minD = minBookableDateStr(), maxD = maxDateStr();
  const list = applySlotFilter(slots.filter(s=>s.status==='open' && s.date>=minD && s.date<=maxD));
  const openDates = [...new Set(list.map(s=>s.date))].sort();
  return openDates;
}
function slotsForDate(dateStr){
  const list = applySlotFilter(slots.filter(s=>s.status==='open' && s.date===dateStr));
  return list.sort((a,b)=>a.time.localeCompare(b.time));
}

function renderSlotRow(s){
  const badge = s.status==='open' ? '<span class="badge badge-open">可預約</span>' : '<span class="badge badge-booked">已預約</span>';

  if(s.status==='booked' && s.booking){

    patientBlock = `<div class="patient-info">
      <div><b>兒童：</b>${b.name}（${b.age}）</div>
      <div><b>生日：</b>${b.birth}</div>
      <div><b>電話：</b>${b.phone}</div>

      ${b.noShow ? '<div style="color:var(--danger); font-weight:700; margin-top:4px;">⚠️ 已標記爽約</div>' : ''}
    </div>
    <div class="row-actions">
      <button class="btn btn-danger btn-small" data-cancel-booking="${s.id}">取消此預約</button>
      ${b.noShow
        ? `<button class="btn btn-secondary btn-small" data-unmark-noshow="${s.id}">取消爽約標記</button>`
        : `<button class="btn btn-secondary btn-small" data-mark-noshow="${s.id}">標記爽約</button>`}
    </div>`;
  } else {
    patientBlock = `<div class="row-actions">
      <button class="btn btn-danger btn-small" data-delete-slot="${s.id}">刪除時段</button>
    </div>`;
  }
  return `<div class="slot-row">
    <div class="top-line">
      <div class="dt">${fmtDateFull(s.date)}　${s.time}</div>
      ${badge}
    </div>
    ${s.note ? `<div class="note">備註：${s.note}</div>` : ''}

}

function render(){
  const root = document.getElementById('app');
  if(!dataLoaded){
    root.innerHTML = renderHeader() + '<div class="content"><div class="loading-wrap">資料載入中…</div></div>';
    return;
  }
  let html = renderHeader();
  if(state.view === 'admin'){
    html += renderAdmin();
  } else if(state.view === 'lookup'){
    html += renderLookup();
  } else if(state.view === 'screening'){
    const s = state.screeningScreen;
    if(s === 'welcome') html += renderScreeningWelcome();
    else if(s === 'langForm') html += renderLangForm();
    else if(s === 'langConfirm') html += renderLangConfirm();
    else if(s === 'torticollisNotice') html += renderTorticollisNotice();
    else html += renderScreeningQuestion(s);
  } else {
    if(state.patientStep===1) html += renderStep1();
    else if(state.patientStep===2) html += renderStep2();
    else html += renderStep3();
  }
  if(state.showAdminLogin){
    html += renderAdminLogin();
  }
  root.innerHTML = html;
  bindEvents();
}

  // 固定時段的自動補齊現在完全交給每日排程（dailySlotRefresh）處理，

/* ============ EVENT BINDING ============ */
function bindEvents(){
  const gearBtn = document.getElementById('gearBtn');
  if(gearBtn) gearBtn.onclick = ()=>{
    if(state.view==='admin'){ /* already in admin */ return; }
    if(auth.currentUser){
      // 已透過 Firebase Authentication 登入過，直接進入後台
      enterAdmin();
    } else {
      state.showAdminLogin = true; render();
    }
  };

  // Admin login modal (Firebase Authentication)
  const pinCancel = document.getElementById('pinCancelBtn');
  if(pinCancel) pinCancel.onclick = ()=>{ state.showAdminLogin=false; render(); };
  const pinSubmit = document.getElementById('pinSubmitBtn');
  if(pinSubmit) pinSubmit.onclick = async ()=>{
    const passEl = document.getElementById('adminPasswordInput');
    const errEl = document.getElementById('pinError');
    const pass = passEl.value;
    errEl.style.display = 'none';
    if(!pass){
      errEl.textContent = '請輸入密碼';
      errEl.style.display = 'block';
      return;
    }
    pinSubmit.disabled = true;
    pinSubmit.textContent = '登入中…';
    try{
      await auth.signInWithEmailAndPassword(ADMIN_EMAIL, pass);
      state.showAdminLogin = false;
      enterAdmin();
    }catch(e){
      console.error(e);
      errEl.textContent = '密碼錯誤，請再試一次';
      errEl.style.display = 'block';
      pinSubmit.disabled = false;
      pinSubmit.textContent = '登入';
    }
  };
  const passInput = document.getElementById('adminPasswordInput');
  if(passInput){
    passInput.focus();
    passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') pinSubmit.click(); });
  }

  if(state.view==='admin'){ bindAdminEvents(); return; }

  if(state.view==='lookup'){ bindLookupEvents(); return; }

  if(state.view==='screening'){ bindScreeningEvents(); return; }

  // ---- Patient step 1 ----
  if(state.patientStep===1){
    const backToScreening = document.getElementById('backToScreeningBtn');
    if(backToScreening) backToScreening.onclick = ()=>{
      state.view = 'screening';
      state.screeningScreen = state.screeningStack.pop() || 'welcome';
      render();
    };
    const nameEl = document.getElementById('f_name');
    const birthEl = document.getElementById('f_birth');
    const phoneEl = document.getElementById('f_phone');
    const issueEl = document.getElementById('f_issue');
    if(nameEl) nameEl.addEventListener('input', e=>{ state.form.name = e.target.value; });
    if(phoneEl) phoneEl.addEventListener('input', e=>{ state.form.phone = e.target.value; });
    if(issueEl) issueEl.addEventListener('input', e=>{ state.form.issue = e.target.value; });
    if(birthEl) birthEl.addEventListener('change', e=>{
      state.form.birth = e.target.value;
      if(state.form.birth && isOverAgeLimit(state.form.birth)){
        alert(AGE_LIMIT_MSG);
      }
      render();
    });
    const nextBtn = document.getElementById('toStep2Btn');
    if(nextBtn) nextBtn.onclick = ()=>{
      const f = state.form;
      if(!f.name.trim()){ showToast('請填寫兒童全名'); return; }
      if(!f.birth || !calcAge(f.birth)){ showToast('請選擇正確的兒童生日'); return; }
      if(isOverAgeLimit(f.birth)){ alert(AGE_LIMIT_MSG); return; }
      if(!f.phone.trim() || f.phone.replace(/\D/g,'').length < 8){ showToast('請填寫正確的聯絡手機'); return; }
      if(!f.issue.trim()){ showToast('請填寫主要問題'); return; }
      // 配額是否超過留到「確認預約」當下才由伺服器驗證，這裡不呼叫雲端函式，
      // 讓下一步的畫面切換是即時的，不用等網路來回。
      state.waitlistMode = false;
      state.selectedDate = null;
      state.selectedSlotId = null;
      state.patientStep = 2;
      render();
      // 進到選時段畫面後，在背景重新抓最新的時段資料，
      // 避免顯示到「其實已經被別人訂走」的舊快照（純Firestore讀取，很快，不會卡畫面）。
      loadSlots().then(()=>{ if(state.patientStep===2) render(); });
    };
  }

  // ---- Patient step 2 ----
  if(state.patientStep===2){
    const backBtn = document.getElementById('backStep1Btn');
    if(backBtn) backBtn.onclick = ()=>{ state.patientStep=1; render(); };

    document.querySelectorAll('.date-chip').forEach(el=>{
      el.onclick = ()=>{ state.selectedDate = el.getAttribute('data-date'); state.selectedSlotId=null; render(); };
    });
    document.querySelectorAll('.time-btn').forEach(el=>{
      el.onclick = ()=>{ state.selectedSlotId = el.getAttribute('data-id'); render(); };
    });
    const toStep3 = document.getElementById('toStep3Btn');
    if(toStep3) toStep3.onclick = async ()=>{
      const slot = slots.find(s=>s.id===state.selectedSlotId);
      if(!slot){ showToast('請選擇時段'); return; }
      toStep3.disabled = true;
      toStep3.textContent = '處理中…';
      const f = state.form;
      try{
        // 配額檢查仍透過 Cloud Function（涉及查詢其他人的資料，需要保護），
        // 實際寫入時段與建立預約則直接寫 Firestore（純寫入，不涉及讀取他人資料）。
        const qRes = await fx.httpsCallable('checkQuota')({ name: f.name, birth: f.birth });
        const { hasFutureBooking, historyExceeded, noShowBlocked } = qRes.data;
        if(noShowBlocked){
          alert('很抱歉，因先前已有 2 次預約未到紀錄，暫停線上預約資格。如有需要，請直接致電本院為您協助安排。');
          toStep3.disabled = false;
          toStep3.textContent = '確認預約時段';
          return;
        }
        if(hasFutureBooking){
          alert('溫馨提醒\n此孩童目前已有一筆有效預約，同一時間僅能保留一筆預約，暫時無法再新增預約。\n如需查詢或取消原有預約，請至「查詢／取消預約」處理；如有其他問題，歡迎致電本院。');
          state.form = { name:'', birth:'', phone:'', issue:'' };
          state.selectedDate = null; state.selectedSlotId = null;
          state.screeningAnswers = {}; state.screeningStack = []; state.slotFilter = 'excludeWed';
          state.screeningScreen = 'welcome';
          state.view = 'screening';
          state.patientStep = 1;
          render();
          return;
        }
        if(historyExceeded){
          alert('溫馨提醒\n此孩童過去已完成兩次評估／門診，目前請改以候補方式登記。\n若後續有名額釋出，我們會主動與您聯繫，謝謝您的理解與配合。');
          state.waitlistMode = true;
          state.selectedSlotId = null;
          render();
          return;
        }
        const age = calcAge(f.birth);
        const slotRef = db.collection('slots').doc(slot.id);
        const bookingRef = db.collection('bookings').doc();
        const result = await db.runTransaction(async (tx)=>{
          const slotDoc = await tx.get(slotRef);
          if(!slotDoc.exists || slotDoc.data().status !== 'open'){
            throw new Error('SLOT_TAKEN');
          }
          const s = slotDoc.data();
          tx.update(slotRef, { status:'booked' });
          tx.set(bookingRef, {
            slotId: slot.id, name:f.name, birth:f.birth, age, phone:f.phone,
            phoneNorm: normPhone(f.phone), issue:f.issue,
            status:'active', bookedAt: Date.now(), noShow:false,
            date: s.date, time: s.time, note: s.note || '',
            screeningAnswers: { ...state.screeningAnswers }
          });
          return { date: s.date, time: s.time, note: s.note || '' };
        });
        slot.status = 'booked';
        state.bookingResult = { type:'booking', name:f.name, age, phone:f.phone, issue:f.issue, ...result };
        state.patientStep = 3;
        render();
      }catch(e){
        console.error(e);
        if(e.message === 'SLOT_TAKEN'){
          showToast('此時段已被預約，請重新選擇');
          await loadSlots();
          render();
        } else {
          showToast('預約失敗，請重試');
          toStep3.disabled = false;
          toStep3.textContent = '確認預約時段';
        }
      }
    };

    const submitWait = document.getElementById('submitWaitlistBtn');
    if(submitWait) submitWait.onclick = async ()=>{
      const f = state.form;
      submitWait.disabled = true;
      submitWait.textContent = '送出中…';
      try{
        const qRes = await fx.httpsCallable('checkQuota')({ name: f.name, birth: f.birth });
        if(qRes.data.noShowBlocked){
          alert('很抱歉，因先前已有 2 次預約未到紀錄，暫停線上預約資格。如有需要，請直接致電本院為您協助安排。');
          submitWait.disabled = false;
          submitWait.textContent = '送出候補登記';
          return;
        }
        const age = calcAge(f.birth);
        await db.collection('waitlist').add({
          name:f.name, birth:f.birth, age, phone:f.phone, phoneNorm: normPhone(f.phone),
          issue:f.issue, submittedAt:Date.now()
        });
        state.bookingResult = { type:'waitlist', name:f.name, age, phone:f.phone, issue:f.issue };
        state.patientStep = 3;
        render();
      }catch(e){
        console.error(e);
        showToast('送出失敗，請重試');
        submitWait.disabled = false;
        submitWait.textContent = '送出候補登記';
      }
    };
  }

  // ---- Patient step 3 ----
  if(state.patientStep===3){
    const restartBtn = document.getElementById('restartBtn');
    if(restartBtn) restartBtn.onclick = ()=>{
      state.form = { name:'', birth:'', phone:'', issue:'' };
      state.selectedDate=null; state.selectedSlotId=null; state.bookingResult=null; state.waitlistMode=false;
      state.screeningAnswers = {}; state.screeningStack = []; state.slotFilter = 'excludeWed';
      state.screeningScreen = 'welcome';
      state.view = 'screening';
      state.patientStep = 1;
      render();
    };
  }
}

// 篩檢流程導覽：goScreen 前進並記錄上一步，backScreen 返回上一步
function goScreen(next){
  state.screeningStack.push(state.screeningScreen);
  state.screeningScreen = next;
  render();
}

// 問卷結束，進入正式預約表單（同時記錄上一步，供表單頁「返回上一步」使用）
function finishScreening(cur, filter){
  state.slotFilter = filter || 'excludeWed';
  state.screeningStack.push(cur);
  state.view = 'patient';
  state.patientStep = 1;
  render();
}

function bindScreeningEvents(){
  const gotoLookup = document.getElementById('gotoLookupBtn');
  if(gotoLookup) gotoLookup.onclick = ()=>{
    state.lookup = { name:'', birth:'', results:[], waitlistResults:[], languageWaitlistResults:[], searched:false };
    state.view = 'lookup';
    render();
  };

  const startBtn = document.getElementById('screeningStartBtn');
  if(startBtn) startBtn.onclick = ()=>{ goScreen('q_main'); };

  const backBtn = document.getElementById('screeningBackBtn');
  if(backBtn) backBtn.onclick = ()=>{
    state.screeningScreen = state.screeningStack.pop() || 'welcome';
    render();
  };

  document.querySelectorAll('[data-screen-choice]').forEach(el=>{
    el.onclick = ()=>{
      const val = parseInt(el.getAttribute('data-screen-choice'), 10);
      const cur = state.screeningScreen;
      state.screeningAnswers[cur] = val;
      if(cur === 'q_main'){
        if(val===1) goScreen('q_attention');
        else if(val===2) goScreen('q_langOT');
        else if(val===4) finishScreening(cur, 'wedOnly'); // 肌力弱、易跌倒、跑跳弱：僅開放週三晚上
        else if(val===5) goScreen('torticollisNotice'); // 斜頸：先顯示提示頁
        else finishScreening(cur); // 情緒及專注力相關問題／其他
      } else if(cur === 'q_attention'){
        if(val===1) finishScreening(cur);
        else goScreen('langForm');
      } else if(cur === 'q_langOT'){
        if(val===1) finishScreening(cur);
        else goScreen('langForm');
      }
    };
  });

  const torticollisNext = document.getElementById('torticollisNextBtn');
  if(torticollisNext) torticollisNext.onclick = ()=>{
    finishScreening('torticollisNotice', 'blocked'); // 斜頸：不開放任何時段，直接進入候補
  };

  // 語言候補表單欄位（跟正式預約表單共用同一組 state.form）
  if(state.screeningScreen === 'langForm'){
    const nameEl = document.getElementById('f_name');
    const birthEl = document.getElementById('f_birth');
    const phoneEl = document.getElementById('f_phone');
    const issueEl = document.getElementById('f_issue');
    if(nameEl) nameEl.addEventListener('input', e=>{ state.form.name = e.target.value; });
    if(phoneEl) phoneEl.addEventListener('input', e=>{ state.form.phone = e.target.value; });
    if(issueEl) issueEl.addEventListener('input', e=>{ state.form.issue = e.target.value; });
    if(birthEl) birthEl.addEventListener('change', e=>{
      state.form.birth = e.target.value;
      render();
    });

    const submitLang = document.getElementById('submitLangBtn');
    if(submitLang) submitLang.onclick = async ()=>{
      const f = state.form;
      if(!f.name.trim()){ showToast('請填寫兒童全名'); return; }
      if(!f.birth || !calcAge(f.birth)){ showToast('請選擇正確的兒童生日'); return; }
      if(!f.phone.trim() || f.phone.replace(/\D/g,'').length < 8){ showToast('請填寫正確的聯絡手機'); return; }
      if(!f.issue.trim()){ showToast('請填寫主要問題'); return; }
      submitLang.disabled = true;
      submitLang.textContent = '送出中…';
      try{
        const age = calcAge(f.birth);
        await db.collection('languageWaitlist').add({
          name:f.name, birth:f.birth, age, phone:f.phone, phoneNorm: normPhone(f.phone),
          issue:f.issue, submittedAt: Date.now(),
          screeningAnswers: { ...state.screeningAnswers }
        });
        goScreen('langConfirm');
      }catch(e){
        console.error(e);
        showToast('送出失敗，請重試');
        submitLang.disabled = false;
        submitLang.textContent = '送出候補登記';
      }
    };
  }

  const restartScreening = document.getElementById('restartScreeningBtn');
  if(restartScreening) restartScreening.onclick = ()=>{
    state.form = { name:'', birth:'', phone:'', issue:'' };
    state.screeningAnswers = {};
    state.screeningStack = [];
    state.slotFilter = 'excludeWed';
    state.screeningScreen = 'welcome';
    state.view = 'screening';
    render();
  };
}

function bindLookupEvents(){
  const nameEl = document.getElementById('lk_name');
  const birthEl = document.getElementById('lk_birth');
  if(nameEl) nameEl.addEventListener('input', e=>{ state.lookup.name = e.target.value; });
  if(birthEl) birthEl.addEventListener('change', e=>{ state.lookup.birth = e.target.value; });

  const backBtn = document.getElementById('backToBookBtn');
  if(backBtn) backBtn.onclick = ()=>{ state.view='screening'; state.screeningScreen='welcome'; render(); };

  const searchBtn = document.getElementById('lookupSearchBtn');
  if(searchBtn) searchBtn.onclick = async ()=>{
    const lk = state.lookup;
    if(!lk.name.trim()){ showToast('請填寫兒童全名'); return; }
    if(!lk.birth){ showToast('請選擇兒童生日'); return; }
    searchBtn.disabled = true;
    searchBtn.textContent = '查詢中…';
    try{
      const res = await fx.httpsCallable('lookupMyBookings')({ name: lk.name, birth: lk.birth });
      lk.results = res.data.results;
      lk.waitlistResults = res.data.waitlistResults || [];
      lk.languageWaitlistResults = res.data.languageWaitlistResults || [];
      lk.searched = true;
    }catch(e){
      console.error(e);
      showToast('查詢失敗，請重試');
    }
    searchBtn.disabled = false;
    searchBtn.textContent = '查詢預約';
    render();
  };

  document.querySelectorAll('[data-cancel-own]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-cancel-own');
      if(!confirm('確定要取消此預約嗎？取消後時段將釋出，若之後仍有需要，請重新預約或登記候補。')) return;
      const lk = state.lookup;
      const booking = lk.results.find(b=>b.id===id);
      if(!booking) return;
      try{
        // 純寫入操作，不需要透過 Cloud Function（家長已透過受保護的查詢拿到這筆預約的正確ID）
        await db.collection('bookings').doc(id).update({ status:'cancelled' });
        await db.collection('slots').doc(booking.slotId).update({ status:'open' });
        showToast('已為您取消預約');
        lk.results = lk.results.filter(x=>x.id!==id);
        render();
      }catch(e){
        console.error(e);
        showToast('取消失敗，請重試');
      }
    };
  });

  document.querySelectorAll('[data-cancel-wait]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-cancel-wait');
      if(!confirm('確定要取消這筆職能候補登記嗎？')) return;
      const lk = state.lookup;
      try{
        await db.collection('waitlist').doc(id).delete();
        showToast('已為您取消候補登記');
        lk.waitlistResults = lk.waitlistResults.filter(x=>x.id!==id);
        render();
      }catch(e){
        console.error(e);
        showToast('取消失敗，請重試');
      }
    };
  });

  document.querySelectorAll('[data-cancel-lang-wait]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-cancel-lang-wait');
      if(!confirm('確定要取消這筆語言候補登記嗎？')) return;
      const lk = state.lookup;
      try{
        await db.collection('languageWaitlist').doc(id).delete();
        showToast('已為您取消候補登記');
        lk.languageWaitlistResults = lk.languageWaitlistResults.filter(x=>x.id!==id);
        render();
      }catch(e){
        console.error(e);
        showToast('取消失敗，請重試');
      }
    };
  });
}

function bindAdminEvents(){
  const logoutBtn = document.getElementById('adminLogoutBtn');
  if(logoutBtn) logoutBtn.onclick = async ()=>{
    await auth.signOut();
    state.view='patient'; state.patientStep=1; render();
  };

  const refreshBtn = document.getElementById('adminRefreshBtn');
  if(refreshBtn) refreshBtn.onclick = async ()=>{
    refreshBtn.disabled = true;
    refreshBtn.textContent = '🔄 更新中…';
    if(state.adminTab === 'audit'){
      await loadAuditLogs();
    } else {
      await loadAdminDashboard();
    }
    showToast('已更新最新資料');
    render();
  };

  document.querySelectorAll('.tab-btn').forEach(el=>{
    el.onclick = async ()=>{
      const tab = el.getAttribute('data-tab');
      state.adminTab = tab;
      if(tab === 'audit'){
        await loadAuditLogs();
      }
      render();
    };
  });

  if(state.adminTab==='slots'){
    const dEl = document.getElementById('ns_date');
    const tEl = document.getElementById('ns_time');
    const nEl = document.getElementById('ns_note');
    if(dEl) dEl.addEventListener('change', e=>{ state.newSlot.date = e.target.value; });
    if(tEl) tEl.addEventListener('input', e=>{ state.newSlot.time = e.target.value; });
    if(nEl) nEl.addEventListener('input', e=>{ state.newSlot.note = e.target.value; });

    // 以下後台操作皆直接寫 Firestore（不再經過 Cloud Function），
    // 但 firestore.rules 要求這些寫入動作都必須是已登入管理員才能執行。
    const addBtn = document.getElementById('addSlotBtn');
    if(addBtn) addBtn.onclick = async ()=>{
      const ns = state.newSlot;
      if(!ns.date){ showToast('請選擇日期'); return; }
      if(!/^\d{1,2}:\d{2}$/.test(ns.time.trim())){ showToast('請輸入正確時間格式，例如 09:30'); return; }
      const timeNorm = ns.time.trim().padStart(5,'0');
      const noteVal = ns.note.trim();
      const data = { date: ns.date, time: timeNorm, note: noteVal, status:'open', source:'manual' };
      try{
        const ref = await db.collection('slots').add(data);
        slots.push({ id: ref.id, ...data });
        state.newSlot = { date:'', time:'', note:'' };
        showToast('已新增時段');
        render();
      }catch(e){
        console.error(e);
        if(isAuthError(e)){ await handleAuthExpired(); return; }
        showToast('新增失敗，請重試');
      }
    };

    document.querySelectorAll('[data-delete-slot]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-delete-slot');
        const target = slots.find(s=>s.id===id);
        if(!confirm('確定要刪除此時段嗎？')) return;
        try{
          await db.collection('slots').doc(id).delete();
          if(target && target.source==='template'){
            const key = target.date+'|'+target.time;
            const metaRef = db.collection('templateMeta').doc('cancelledOcc');
            await db.runTransaction(async (tx)=>{
              const metaDoc = await tx.get(metaRef);
              const list = (metaDoc.exists && metaDoc.data().list) ? metaDoc.data().list : [];
              if(!list.includes(key)){
                list.push(key);
                tx.set(metaRef, { list });
              }
            });
            if(!cancelledOcc.includes(key)) cancelledOcc.push(key);
          }
          slots = slots.filter(s=>s.id!==id);
          showToast('已刪除時段');
          render();
        }catch(e){
          console.error(e);
          if(isAuthError(e)){ await handleAuthExpired(); return; }
          showToast('刪除失敗，請重試');
        }
      };
    });
    document.querySelectorAll('[data-cancel-booking]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-cancel-booking');
        const slot = slots.find(x=>x.id===id);
        if(!confirm('確定要取消此預約嗎？時段將釋出供其他人預約，請記得電話通知候補名單。')) return;
        try{
          if(slot && slot.booking && slot.booking._bookingId){
            await db.collection('bookings').doc(slot.booking._bookingId).update({ status:'cancelled' });
          }
          await db.collection('slots').doc(id).update({ status:'open' });
          if(slot){ slot.status='open'; delete slot.booking; }
          showToast('已取消預約，時段已釋出');
          render();
        }catch(e){
          console.error(e);
          if(isAuthError(e)){ await handleAuthExpired(); return; }
          showToast('操作失敗，請重試');
        }
      };
    });
    document.querySelectorAll('[data-mark-noshow]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-mark-noshow');
        const slot = slots.find(x=>x.id===id);
        if(!slot || !slot.booking || !slot.booking._bookingId) return;
        if(!confirm('確定要將這筆預約標記為「爽約」嗎？\n\n同一孩童累計 2 次爽約後，將自動暫停其線上預約資格。')) return;
        try{
          await db.collection('bookings').doc(slot.booking._bookingId).update({ noShow: true });
          slot.booking.noShow = true;
          showToast('已標記為爽約');
          render();
        }catch(e){
          console.error(e);
          if(isAuthError(e)){ await handleAuthExpired(); return; }
          showToast('操作失敗，請重試');
        }
      };
    });
    document.querySelectorAll('[data-unmark-noshow]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-unmark-noshow');
        const slot = slots.find(x=>x.id===id);
        if(!slot || !slot.booking || !slot.booking._bookingId) return;
        try{
          await db.collection('bookings').doc(slot.booking._bookingId).update({ noShow: false });
          slot.booking.noShow = false;
          showToast('已取消爽約標記');
          render();
        }catch(e){
          console.error(e);
          if(isAuthError(e)){ await handleAuthExpired(); return; }
          showToast('操作失敗，請重試');
        }
      };
    });
    document.querySelectorAll('[data-restore-occ]').forEach(el=>{
      el.onclick = async ()=>{
        const key = el.getAttribute('data-restore-occ');
        try{
          const [dateStr, timeStr] = key.split('|');
          const metaRef = db.collection('templateMeta').doc('cancelledOcc');
          await db.runTransaction(async (tx)=>{
            const metaDoc = await tx.get(metaRef);
            const list = (metaDoc.exists && metaDoc.data().list) ? metaDoc.data().list : [];
            tx.set(metaRef, { list: list.filter(k=>k!==key) });
          });
          cancelledOcc = cancelledOcc.filter(k=>k!==key);
          // 若日期仍在未來範圍內、且目前還沒有對應時段，直接補建這一筆，不用等隔天的每日自動排程
          const today = todayStr();
          const alreadyExists = slots.some(s=>s.date===dateStr && s.time===timeStr);
          if(dateStr >= today && !alreadyExists){
            const data = { date: dateStr, time: timeStr, note:'', status:'open', source:'template' };
            const ref = await db.collection('slots').add(data);
            slots.push({ id: ref.id, ...data });
          }
          showToast('已恢復開放此時段');
          render();
        }catch(e){
          console.error(e);
          if(isAuthError(e)){ await handleAuthExpired(); return; }
          showToast('操作失敗，請重試');
        }
      };
    });
  } else {
    document.querySelectorAll('[data-remove-wait]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-remove-wait');
        try{
          // 移除候補不需要登入驗證（依需求設定，靠每日備份因應誤刪風險）
          await db.collection('waitlist').doc(id).delete();
          waitlist = waitlist.filter(w=>w.id!==id);
          render();
        }catch(e){
          console.error(e);
          showToast('刪除失敗，請重試');
        }
      };
    });
    document.querySelectorAll('[data-remove-lang-wait]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-remove-lang-wait');
        try{
          // 移除候補不需要登入驗證（依需求設定，靠每日備份因應誤刪風險）
          await db.collection('languageWaitlist').doc(id).delete();
          languageWaitlist = languageWaitlist.filter(w=>w.id!==id);
          render();
        }catch(e){
          console.error(e);
          showToast('刪除失敗，請重試');
        }
      };
    });
  }
}

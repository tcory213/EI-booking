<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<style>

    --tiffany:#0ABAB5;
    --tiffany-dark:#078883;
    --tiffany-deep:#056560;

  .gear-btn{

  .fp-label{font-size:11px; color:rgba(255,255,255,0.75); white-space:nowrap;}
  .fp-step.active .fp-label{color:#fff; font-weight:700;}
  .fp-line{flex:1; height:2px; background:rgba(255,255,255,0.25); border-radius:2px;}
  .fp-line.active{background:#fff;}

  /* MAIN CONTENT */
  .content{padding:18px 16px 8px;}
  .card{
    background:#fff;
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
    border:1px solid var(--border);
  }
  .notice-card{
    background:var(--tiffany-light);
    border:1px solid #BDEAE7;

  .notice-card ol{margin:0; padding-left:18px; font-size:13.5px; line-height:1.75; color:var(--ink);}
  .notice-card li{margin-bottom:4px;}

  .notice-item:last-of-type{margin-bottom:0;}
  .notice-item b{display:block; font-weight:700; font-size:13.5px; color:var(--ink); line-height:1.6; margin-bottom:3px;}
  .notice-sub{font-size:12.5px; color:var(--ink-soft); line-height:1.7;}
  .notice-thanks{margin-top:12px; padding-top:10px; border-top:1px dashed #BDEAE7; font-size:12.5px; color:var(--tiffany-deep); font-weight:700; line-height:1.7;}
  .link-btn{background:none; border:none; color:var(--tiffany-deep); font-size:12.5px; font-weight:700; cursor:pointer; padding:4px 0; font-family:inherit;}

  label.field-label{

  label.field-label:first-child{margin-top:0;}
  .req{color:var(--coral-dark); font-weight:700;}
  input[type=text], input[type=tel], input[type=date], textarea, select{

  .age-warning{

    display:flex; align-items:center; gap:10px; background:var(--tiffany-light);

  .time-btn{
    padding:12px 4px; border-radius:12px; border:1.5px solid var(--border); background:#fff;
    text-align:center; font-weight:700; font-size:14.5px; cursor:pointer; color:var(--ink);

  .detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--border); font-size:13.5px;}
  .detail-row:last-child{border-bottom:none;}

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:800;}
  .badge-open{background:#E3F7F6; color:var(--tiffany-dark);}

  /* ADMIN */
  .admin-overlay{
    position:fixed; inset:0; background:rgba(6,60,58,0.55); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .admin-modal{background:#fff; border-radius:20px; padding:24px 22px; width:100%; max-width:340px;}
  .admin-modal h3{margin:0 0 4px; font-size:17px;}
  .admin-modal p.sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px;}
  .pin-error{color:var(--danger); font-size:12.5px; margin-top:8px; display:none;}

  .admin-header{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
  }
  .admin-header .atitle{font-weight:900; font-size:16px;}
  .tab-row{display:flex; gap:8px; margin-bottom:16px;}
  .tab-btn{
    flex:1; text-align:center; padding:10px 4px; border-radius:12px; border:1.5px solid var(--border);
    font-size:13.5px; font-weight:700; color:var(--ink-soft); background:#fff; cursor:pointer;

  .slot-row{
    border:1.5px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:10px; background:#fff;
  }
  .slot-row .top-line{display:flex; justify-content:space-between; align-items:center;}
  .slot-row .dt{font-weight:800; font-size:14.5px; font-family:'Baloo 2',sans-serif;}
  .slot-row .note{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .slot-row .patient-info{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:12.5px; line-height:1.8;
  }
  .slot-row .patient-info b{color:var(--ink);}
  .row-actions{display:flex; gap:8px; margin-top:10px;}

  .waitlist-row{
    border:1.5px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:10px; background:#fff;

  .footer-note{text-align:center; font-size:11px; color:var(--ink-faint); padding:14px 30px 0; line-height:1.6;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:11px 20px; border-radius:30px; font-size:13.5px; z-index:100; opacity:0; transition:opacity .3s; pointer-events:none;
    max-width:80%; text-align:center;
  }
  .toast.show{opacity:1;}
  .loading-wrap{display:flex; align-items:center; justify-content:center; padding:60px 0; color:var(--ink-soft); font-size:13.5px;}
</style>
</head>
<body>
<div class="app-shell" id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============ FIREBASE 設定 ============ */
/* 請至 Firebase 主控台 > 專案設定 > 一般 > 你的應用程式，複製網頁應用程式設定值貼在這裡 */
const firebaseConfig = {
  apiKey: "AIzaSyBgvbGScAeBC7gQsNoQ7QwmJIanpLGGWLs",
  authDomain: "ei-booking.firebaseapp.com",
  projectId: "ei-booking",
  storageBucket: "ei-booking.firebasestorage.app",
  messagingSenderId: "52050810041",
  appId: "1:52050810041:web:f30dba6d6f856c1c14f768"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const CLINIC_COLLECTION = 'clinicData'; // Firestore collection 名稱

/* ============ STATE ============ */
const ADMIN_PIN = "0000"; // 展示用簡易密碼，正式上線請改為真實後端驗證機制

let slots = [];
let waitlist = [];
let cancelledOcc = [];   // 已被後台取消的「固定時段」單次紀錄 (格式: "YYYY-MM-DD|HH:MM")
let dataLoaded = false;

// 預設固定門診／評估時段樣板：dow 依 JS 慣例 0=週日...6=週六
// 週二(2) 09:20 / 10:00 / 10:40，週三(3) 20:00，週五(5) 17:50 / 18:50
const SLOT_TEMPLATE = [
  { dow:2, time:'09:20' },
  { dow:2, time:'10:00' },
  { dow:2, time:'10:40' },
  { dow:3, time:'20:00' },
  { dow:5, time:'17:50' },
  { dow:5, time:'18:50' },
];
const TEMPLATE_LABEL = '週二 09:20、10:00、10:40｜週三 20:00｜週五 17:50、18:50';

let state = {
  view: 'patient',        // patient | admin
  patientStep: 1,
  form: { name:'', birth:'', phone:'', issue:'' },
  selectedDate: null,
  selectedSlotId: null,
  waitlistMode: false,     // true if quota exceeded or no slots at all -> goes to waitlist
  bookingResult: null,
  adminLoggedIn: false,
  showAdminLogin: false,
  adminTab: 'slots',
  newSlot: { date:'', time:'', note:'' },
  lookup: { name:'', birth:'', results:[], searched:false },
};

/* ============ HELPERS ============ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function maxDateStr(){ const d=new Date(); d.setDate(d.getDate()+90); return d.toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function normPhone(p){ return (p||'').replace(/\D/g,''); }

// 系統自動計算：以「電話 + 生日」比對已預約紀錄，算出此童已使用過的評估/門診次數
function usedCountFor(phone, birth){
  const np = normPhone(phone);
  return slots.filter(s => s.status==='booked' && s.booking &&
    normPhone(s.booking.phone)===np && s.booking.birth===birth).length;
}

function calcAge(birthStr){
  if(!birthStr) return null;
  const b = new Date(birthStr+'T00:00:00');
  const now = new Date();
  if(isNaN(b.getTime()) || b > now) return null;
  let years = now.getFullYear() - b.getFullYear();
  let months = now.getMonth() - b.getMonth();
  if(now.getDate() < b.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  return years+'歲'+months+'個月';
}

const AGE_LIMIT_MSG = '很抱歉由於健保政策規範，目前早療初評僅提供8歲半以下兒童。超過8歲半兒童建議尋求兒童身心科協助。';

function ageInMonths(birthStr){
  if(!birthStr) return null;
  const b = new Date(birthStr+'T00:00:00');
  const now = new Date();
  if(isNaN(b.getTime()) || b > now) return null;
  let years = now.getFullYear() - b.getFullYear();
  let months = now.getMonth() - b.getMonth();
  if(now.getDate() < b.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  return years*12 + months;
}
function isOverAgeLimit(birthStr){
  const m = ageInMonths(birthStr);
  return m !== null && m > 102;
}

function fmtDateChip(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = ['日','一','二','三','四','五','六'][d.getDay()];
  return { dow:'週'+dow, dnum:(d.getMonth()+1)+'/'+d.getDate() };
}
function fmtDateFull(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = ['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日（週'+dow+'）';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ STORAGE (Firestore) ============ */
async function loadData(){
  try{
    const doc = await db.collection(CLINIC_COLLECTION).doc('slots').get();
    slots = doc.exists && doc.data().json ? JSON.parse(doc.data().json) : [];
  }catch(e){ console.error(e); slots = []; }
  try{
    const doc2 = await db.collection(CLINIC_COLLECTION).doc('waitlist').get();
    waitlist = doc2.exists && doc2.data().json ? JSON.parse(doc2.data().json) : [];
  }catch(e){ console.error(e); waitlist = []; }
  try{
    const doc3 = await db.collection(CLINIC_COLLECTION).doc('cancelledOcc').get();
    cancelledOcc = doc3.exists && doc3.data().json ? JSON.parse(doc3.data().json) : [];
  }catch(e){ console.error(e); cancelledOcc = []; }
  dataLoaded = true;
}
async function saveSlots(){
  try{ await db.collection(CLINIC_COLLECTION).doc('slots').set({ json: JSON.stringify(slots) }); }
  catch(e){ console.error(e); showToast('資料儲存失敗，請重試'); }
}
async function saveWaitlist(){
  try{ await db.collection(CLINIC_COLLECTION).doc('waitlist').set({ json: JSON.stringify(waitlist) }); }
  catch(e){ console.error(e); showToast('資料儲存失敗，請重試'); }
}
async function saveCancelled(){
  try{ await db.collection(CLINIC_COLLECTION).doc('cancelledOcc').set({ json: JSON.stringify(cancelledOcc) }); }
  catch(e){ console.error(e); showToast('資料儲存失敗，請重試'); }
}

// 依樣板自動補齊未來三個月內的固定時段（已被後台取消或已存在者不重複產生）
function ensureTemplateSlots(){
  const today = new Date(); today.setHours(0,0,0,0);
  let changed = false;
  for(let i=0; i<=90; i++){
    const d = new Date(today); d.setDate(d.getDate()+i);
    const dow = d.getDay();
    const matches = SLOT_TEMPLATE.filter(t=>t.dow===dow);
    if(matches.length===0) continue;
    const dateStr = d.toISOString().slice(0,10);
    matches.forEach(t=>{
      const key = dateStr+'|'+t.time;
      if(cancelledOcc.includes(key)) return;
      const exists = slots.some(s=>s.date===dateStr && s.time===t.time);
      if(!exists){
        slots.push({ id:uid(), date:dateStr, time:t.time, note:'', status:'open', booking:null, source:'template' });
        changed = true;
      }
    });
  }
  return changed;
}

/* ============ FOOTPRINT STEPS ============ */
function renderFootprints(){
  const steps = ['填寫資料','選擇時段','完成預約'];
  let html = '<div class="footprints">';
  steps.forEach((label, i)=>{
    const n = i+1;
    const active = state.patientStep >= n;
    html += '<div class="fp-step '+(active?'active':'')+'"><div class="fp-icon">'+n+'</div><div class="fp-label">'+label+'</div></div>';
    if(i < steps.length-1){
      html += '<div class="fp-line '+(state.patientStep > n ? 'active':'')+'"></div>';
    }
  });
  html += '</div>';
  return html;
}

/* ============ RENDER: HEADER ============ */
function renderHeader(){
  return `
  <div class="header">
    <div class="header-top">
      <div>
        <div class="clinic-name">EI BOOKING</div>
        <div class="title">家歡診所兒童早療暨<br>門診評估預約表</div>
      </div>
      <button class="gear-btn" id="gearBtn" title="院所後台">⚙</button>
    </div>
    ${state.view==='patient' ? renderFootprints() : ''}
  </div>`;
}

/* ============ NOTICE CARD (reusable) ============ */
function renderNoticeCard(){
  return `
    <div class="notice-card">
      <h3>🌷 兒童評估與門診預約小提醒</h3>
      <div class="notice-item">

/* ============ RENDER: PATIENT STEP 2 ============ */
function availableDates(){
  const today = todayStr(), maxD = maxDateStr();
  const openDates = [...new Set(
    slots.filter(s=>s.status==='open' && s.date>=today && s.date<=maxD).map(s=>s.date)
  )].sort();
  return openDates;
}
function slotsForDate(dateStr){
  return slots.filter(s=>s.status==='open' && s.date===dateStr).sort((a,b)=>a.time.localeCompare(b.time));
}

function renderSummaryChip(){
  const f = state.form;
  const initial = f.name ? f.name.charAt(0) : '兒';
  return `<div class="summary-chip">
    <div class="avatar">${initial}</div>
    <div><div class="sname">${f.name}</div><div class="sage">${calcAge(f.birth)||''}・${f.phone}</div></div>
  </div>`;
}

/* ============ MASTER RENDER ============ */
function render(){
  const root = document.getElementById('app');
  if(!dataLoaded){
    root.innerHTML = renderHeader() + '<div class="content"><div class="loading-wrap">資料載入中…</div></div>';
    return;
  }
  let html = renderHeader();
  if(state.view === 'admin'){
    html += renderAdmin();
  } else if(state.view === 'lookup'){
    html += renderLookup();
  } else {
    if(state.patientStep===1) html += renderStep1();
    else if(state.patientStep===2) html += renderStep2();
    else html += renderStep3();
  }
  if(state.showAdminLogin){
    html += renderAdminLogin();
  }
  root.innerHTML = html;
  bindEvents();
}

/* ============ EVENT BINDING ============ */
function bindEvents(){
  const gearBtn = document.getElementById('gearBtn');
  if(gearBtn) gearBtn.onclick = ()=>{
    if(state.view==='admin'){ /* already in admin */ return; }
    state.showAdminLogin = true; render();
  };

  // Admin login modal
  const pinCancel = document.getElementById('pinCancelBtn');
  if(pinCancel) pinCancel.onclick = ()=>{ state.showAdminLogin=false; render(); };
  const pinSubmit = document.getElementById('pinSubmitBtn');
  if(pinSubmit) pinSubmit.onclick = ()=>{
    const val = document.getElementById('pinInput').value;
    if(val === ADMIN_PIN){
      state.showAdminLogin=false; state.view='admin'; state.adminTab='slots'; render();
    } else {
      document.getElementById('pinError').style.display='block';
    }
  };
  const pinInput = document.getElementById('pinInput');
  if(pinInput){
    pinInput.focus();
    pinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') pinSubmit.click(); });
  }

  if(state.view==='admin'){ bindAdminEvents(); return; }

  if(state.view==='lookup'){ bindLookupEvents(); return; }

  const gotoLookup = document.getElementById('gotoLookupBtn');
  if(gotoLookup) gotoLookup.onclick = ()=>{
    state.lookup = { name:'', birth:'', results:[], searched:false };
    state.view = 'lookup';
    render();
  };

  // ---- Patient step 1 ----
  if(state.patientStep===1){
    const nameEl = document.getElementById('f_name');
    const birthEl = document.getElementById('f_birth');
    const phoneEl = document.getElementById('f_phone');
    const issueEl = document.getElementById('f_issue');
    if(nameEl) nameEl.addEventListener('input', e=>{ state.form.name = e.target.value; });
    if(phoneEl) phoneEl.addEventListener('input', e=>{ state.form.phone = e.target.value; });
    if(issueEl) issueEl.addEventListener('input', e=>{ state.form.issue = e.target.value; });
    if(birthEl) birthEl.addEventListener('change', e=>{
      state.form.birth = e.target.value;
      if(state.form.birth && isOverAgeLimit(state.form.birth)){
        alert(AGE_LIMIT_MSG);
      }
      render();
    });
    const nextBtn = document.getElementById('toStep2Btn');
    if(nextBtn) nextBtn.onclick = ()=>{
      const f = state.form;
      if(!f.name.trim()){ showToast('請填寫兒童全名'); return; }
      if(!f.birth || !calcAge(f.birth)){ showToast('請選擇正確的兒童生日'); return; }
      if(isOverAgeLimit(f.birth)){ alert(AGE_LIMIT_MSG); return; }
      if(!f.phone.trim() || f.phone.replace(/\D/g,'').length < 8){ showToast('請填寫正確的聯絡電話'); return; }
      if(!f.issue.trim()){ showToast('請填寫主要問題'); return; }
      // 系統自動比對電話+生日，計算此童已使用過的評估/門診次數
      const used = usedCountFor(f.phone, f.birth);
      state.waitlistMode = (used >= 2);
      state.selectedDate = null;
      state.selectedSlotId = null;
      state.patientStep = 2;
      render();
    };
  }

  // ---- Patient step 2 ----
  if(state.patientStep===2){
    const backBtn = document.getElementById('backStep1Btn');
    if(backBtn) backBtn.onclick = ()=>{ state.patientStep=1; render(); };

    document.querySelectorAll('.date-chip').forEach(el=>{
      el.onclick = ()=>{ state.selectedDate = el.getAttribute('data-date'); state.selectedSlotId=null; render(); };
    });
    document.querySelectorAll('.time-btn').forEach(el=>{
      el.onclick = ()=>{ state.selectedSlotId = el.getAttribute('data-id'); render(); };
    });
    const toStep3 = document.getElementById('toStep3Btn');
    if(toStep3) toStep3.onclick = async ()=>{
      const slot = slots.find(s=>s.id===state.selectedSlotId);
      if(!slot || slot.status!=='open'){ showToast('此時段已被預約，請重新選擇'); await loadData(); render(); return; }
      const f = state.form;
      const age = calcAge(f.birth);
      const used = usedCountFor(f.phone, f.birth);
      const countLabel = '第 '+(used+1)+' 次（上限2次）';
      slot.status='booked';
      slot.booking = { name:f.name, birth:f.birth, age, phone:f.phone, issue:f.issue, priorLabel:countLabel, bookedAt:Date.now() };
      await saveSlots();
      state.bookingResult = { type:'booking', name:f.name, age, phone:f.phone, issue:f.issue, date:slot.date, time:slot.time, note:slot.note };
      state.patientStep = 3;
      render();
    };

    const submitWait = document.getElementById('submitWaitlistBtn');
    if(submitWait) submitWait.onclick = async ()=>{
      const f = state.form;
      const age = calcAge(f.birth);
      const used = usedCountFor(f.phone, f.birth);
      const countLabel = used>=2 ? '已達2次上限' : ('第 '+(used+1)+' 次（上限2次）');
      const entry = { id:uid(), name:f.name, birth:f.birth, age, phone:f.phone, issue:f.issue, priorLabel:countLabel, submittedAt:Date.now() };
      waitlist.push(entry);
      await saveWaitlist();
      state.bookingResult = { type:'waitlist', name:f.name, age, phone:f.phone, issue:f.issue };
      state.patientStep = 3;
      render();
    };
  }

  // ---- Patient step 3 ----
  if(state.patientStep===3){
    const restartBtn = document.getElementById('restartBtn');
    if(restartBtn) restartBtn.onclick = ()=>{
      state.form = { name:'', birth:'', phone:'', issue:'' };
      state.selectedDate=null; state.selectedSlotId=null; state.bookingResult=null; state.waitlistMode=false;
      state.patientStep = 1;
      render();
    };
  }
}

function bindLookupEvents(){
  const nameEl = document.getElementById('lk_name');
  const birthEl = document.getElementById('lk_birth');
  if(nameEl) nameEl.addEventListener('input', e=>{ state.lookup.name = e.target.value; });
  if(birthEl) birthEl.addEventListener('change', e=>{ state.lookup.birth = e.target.value; });

  const backBtn = document.getElementById('backToBookBtn');
  if(backBtn) backBtn.onclick = ()=>{ state.view='patient'; state.patientStep=1; render(); };

  const searchBtn = document.getElementById('lookupSearchBtn');
  if(searchBtn) searchBtn.onclick = ()=>{
    const lk = state.lookup;
    if(!lk.name.trim()){ showToast('請填寫兒童全名'); return; }
    if(!lk.birth){ showToast('請選擇兒童生日'); return; }
    const today = todayStr();
    lk.results = slots.filter(s=>
      s.status==='booked' && s.booking &&
      s.booking.name.trim()===lk.name.trim() &&
      s.booking.birth===lk.birth &&
      s.date>=today
    ).sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
    lk.searched = true;
    render();
  };

  document.querySelectorAll('[data-cancel-own]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-cancel-own');
      if(!confirm('確定要取消此預約嗎？取消後時段將釋出，若之後仍有需要，請重新預約或登記候補。')) return;
      const s = slots.find(x=>x.id===id);
      if(s){ s.status='open'; s.booking=null; }
      await saveSlots();
      showToast('已為您取消預約');
      const lk = state.lookup;
      lk.results = lk.results.filter(x=>x.id!==id);
      render();
    };
  });
}

function bindAdminEvents(){
  const logoutBtn = document.getElementById('adminLogoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{ state.view='patient'; state.patientStep=1; render(); };

  document.querySelectorAll('.tab-btn').forEach(el=>{
    el.onclick = ()=>{ state.adminTab = el.getAttribute('data-tab'); render(); };
  });

  if(state.adminTab==='slots'){
    const dEl = document.getElementById('ns_date');
    const tEl = document.getElementById('ns_time');
    const nEl = document.getElementById('ns_note');
    if(dEl) dEl.addEventListener('change', e=>{ state.newSlot.date = e.target.value; });
    if(tEl) tEl.addEventListener('input', e=>{ state.newSlot.time = e.target.value; });
    if(nEl) nEl.addEventListener('input', e=>{ state.newSlot.note = e.target.value; });

    const addBtn = document.getElementById('addSlotBtn');
    if(addBtn) addBtn.onclick = async ()=>{
      const ns = state.newSlot;
      if(!ns.date){ showToast('請選擇日期'); return; }
      if(!/^\d{1,2}:\d{2}$/.test(ns.time.trim())){ showToast('請輸入正確時間格式，例如 09:30'); return; }
      const timeNorm = ns.time.trim().padStart(5,'0');
      slots.push({ id:uid(), date:ns.date, time:timeNorm, note:ns.note.trim(), status:'open', booking:null });
      await saveSlots();
      state.newSlot = { date:'', time:'', note:'' };
      showToast('已新增時段');
      render();
    };

    document.querySelectorAll('[data-delete-slot]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-delete-slot');
        const target = slots.find(s=>s.id===id);
        if(!confirm('確定要刪除此時段嗎？')) return;
        if(target && target.source==='template'){
          const key = target.date+'|'+target.time;
          if(!cancelledOcc.includes(key)) cancelledOcc.push(key);
          await saveCancelled();
        }
        slots = slots.filter(s=>s.id!==id);
        await saveSlots();
        showToast('已刪除時段');
        render();
      };
    });
    document.querySelectorAll('[data-cancel-booking]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-cancel-booking');
        if(!confirm('確定要取消此預約嗎？時段將釋出供其他人預約，請記得電話通知候補名單。')) return;
        const s = slots.find(x=>x.id===id);
        if(s){ s.status='open'; s.booking=null; }
        await saveSlots();
        showToast('已取消預約，時段已釋出');
        render();
      };
    });
    document.querySelectorAll('[data-restore-occ]').forEach(el=>{
      el.onclick = async ()=>{
        const key = el.getAttribute('data-restore-occ');
        cancelledOcc = cancelledOcc.filter(k=>k!==key);
        await saveCancelled();
        if(ensureTemplateSlots()){ await saveSlots(); }
        showToast('已恢復開放此時段');
        render();
      };
    });
  } else {
    document.querySelectorAll('[data-remove-wait]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-remove-wait');
        waitlist = waitlist.filter(w=>w.id!==id);
        await saveWaitlist();
        render();
      };
    });
  }
}

/* ============ INIT ============ */
(async function init(){
  render(); // show loading
  await loadData();
  if(ensureTemplateSlots()){ await saveSlots(); }
  render();
})();
</script>

<body>
<div class="app-shell" id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============ FIREBASE 設定 ============ */
/* 請至 Firebase 主控台 > 專案設定 > 一般 > 你的應用程式，複製網頁應用程式設定值貼在這裡 */
const firebaseConfig = {
  apiKey: "AIzaSyBgvbGScAeBC7gQsNoQ7QwmJIanpLGGWLs",
  authDomain: "ei-booking.firebaseapp.com",
  projectId: "ei-booking",
  storageBucket: "ei-booking.firebasestorage.app",
  messagingSenderId: "52050810041",
  appId: "1:52050810041:web:f30dba6d6f856c1c14f768"
};
firebase.initializeApp(firebaseConfig);

/* ============ APP CHECK 設定 ============ */
/* 請至 Firebase 主控台 > App Check > 註冊你的網頁應用程式 (reCAPTCHA Enterprise，
   舊版 reCAPTCHA v3 已被 Google 標示為淘汰，新註冊一律使用 Enterprise)，
   取得 Site Key 後貼在這裡。設定好前，App Check 只會記錄不會擋任何請求。 */
const RECAPTCHA_ENTERPRISE_SITE_KEY = "6LfnWaYtAAAAADCiifn0RGLyNAoGtLn--eb6dcp0";
if (RECAPTCHA_ENTERPRISE_SITE_KEY && RECAPTCHA_ENTERPRISE_SITE_KEY.indexOf('REPLACE_WITH') !== 0) {
  firebase.appCheck().activate(
    new firebase.appCheck.ReCaptchaEnterpriseProvider(RECAPTCHA_ENTERPRISE_SITE_KEY),
    true // isTokenAutoRefreshEnabled
  );
}

const db = firebase.firestore();
const auth = firebase.auth();
const fx = firebase.functions();

/* ============ STATE ============ */

let slots = [];       // 公開資料：時段列表 (date/time/note/status/source)，不含任何病患個資
let waitlist = [];    // 私密資料：候補名單，僅後台登入後才會載入
let cancelledOcc = [];   // 已被後台取消的「固定時段」單次紀錄 (格式: "YYYY-MM-DD|HH:MM")，僅後台使用
let auditLogs = [];   // 稽核紀錄，僅後台登入後才會載入
let dataLoaded = false;

const AUDIT_ACTION_LABELS = {
  checkQuota: '查詢配額',
  bookSlot: '家長預約時段',
  submitWaitlist: '送出候補登記',
  lookupMyBookings: '家長查詢預約',
  cancelMyBooking: '家長取消預約',
  adminGetDashboardData: '後台讀取資料',
  adminAddSlot: '後台新增時段',
  adminDeleteSlot: '後台刪除時段',
  adminCancelBooking: '後台取消預約',
  adminRestoreOccurrence: '後台恢復時段',
  adminRemoveWaitlistEntry: '後台移除候補',
  adminRegenerateTemplate: '後台重新產生時段',
};

// 預設固定門診／評估時段樣板：dow 依 JS 慣例 0=週日...6=週六
// 週二(2) 09:20 / 10:00 / 10:40，週三(3) 20:00，週五(5) 17:50 / 18:50
const SLOT_TEMPLATE = [
  { dow:2, time:'09:20' },
  { dow:2, time:'10:00' },
  { dow:2, time:'10:40' },
  { dow:3, time:'20:00' },
  { dow:5, time:'17:50' },
  { dow:5, time:'18:50' },
];
const TEMPLATE_LABEL = '週二 09:20、10:00、10:40｜週三 20:00｜週五 17:50、18:50';

let state = {
  view: 'patient',        // patient | admin | lookup
  patientStep: 1,
  form: { name:'', birth:'', phone:'', issue:'' },
  selectedDate: null,
  selectedSlotId: null,
  waitlistMode: false,     // true if quota exceeded or no slots at all -> goes to waitlist
  bookingResult: null,
  showAdminLogin: false,
  adminTab: 'slots',
  newSlot: { date:'', time:'', note:'' },
  lookup: { name:'', birth:'', results:[], searched:false },
};

/* ============ HELPERS ============ */
// 以「本地時區」組出 YYYY-MM-DD，避免 toISOString() 轉成UTC造成日期偏移一天的問題
function toLocalISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return toLocalISODate(new Date()); }
function maxDateStr(){ const d=new Date(); d.setDate(d.getDate()+90); return toLocalISODate(d); }

function normPhone(p){ return (p||'').replace(/\D/g,''); }

function calcAge(birthStr){
  if(!birthStr) return null;
  const b = new Date(birthStr+'T00:00:00');
  const now = new Date();
  if(isNaN(b.getTime()) || b > now) return null;
  let years = now.getFullYear() - b.getFullYear();
  let months = now.getMonth() - b.getMonth();
  if(now.getDate() < b.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  return years+'歲'+months+'個月';
}

const AGE_LIMIT_MSG = '很抱歉由於健保政策規範，目前早療初評僅提供8歲半以下兒童。超過8歲半兒童建議尋求兒童身心科協助。';

function ageInMonths(birthStr){
  if(!birthStr) return null;
  const b = new Date(birthStr+'T00:00:00');
  const now = new Date();
  if(isNaN(b.getTime()) || b > now) return null;
  let years = now.getFullYear() - b.getFullYear();
  let months = now.getMonth() - b.getMonth();
  if(now.getDate() < b.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  return years*12 + months;
}
function isOverAgeLimit(birthStr){
  const m = ageInMonths(birthStr);
  return m !== null && m > 102;
}

function fmtDateChip(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = ['日','一','二','三','四','五','六'][d.getDay()];
  return { dow:'週'+dow, dnum:(d.getMonth()+1)+'/'+d.getDate() };
}
function fmtDateFull(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = ['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日（週'+dow+'）';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ STORAGE (Firestore: slots為公開集合, patients底下的bookings子集合為私密集合) ============ */

// 載入公開的時段列表（任何人都能讀取，不含病患個資）
async function loadSlots(){
  try{
    const snap = await db.collection('slots').get();
    slots = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }catch(e){ console.error(e); slots = []; }
}

// 後台專用：透過 Cloud Function 一次取回時段（含病患資料）、候補名單、固定時段停開清單
// 病患個資完全不經過前端直接讀寫 Firestore，全部由伺服器端驗證身分後回傳
async function loadAdminDashboard(){
  try{
    const res = await fx.httpsCallable('adminGetDashboardData')();
    slots = res.data.slots;
    waitlist = res.data.waitlist;
    cancelledOcc = res.data.cancelledOcc;
  }catch(e){
    console.error(e);
    showToast('讀取後台資料失敗，請確認已用管理員帳號登入');
  }
}

// 依樣板補齊未來三個月內的固定時段（伺服器端執行）
async function regenerateTemplateOnServer(){
  try{
    const res = await fx.httpsCallable('adminRegenerateTemplate')();
    return res.data;
  }catch(e){
    console.error(e);
    showToast('產生固定時段失敗，請確認已用管理員帳號登入');
    return { created: 0, deleted: 0 };
  }
}

// 載入稽核紀錄（僅後台，用於萬一懷疑遭入侵時佐證來源IP／是否來自境外）
async function loadAuditLogs(){
  try{
    const res = await fx.httpsCallable('adminGetAuditLogs')({ limit: 200 });
    auditLogs = res.data.logs;
  }catch(e){
    console.error(e);

}

/* ============ FOOTPRINT STEPS ============ */
function renderFootprints(){
  const steps = ['填寫資料','選擇時段','完成預約'];
  let html = '<div class="footprints">';
  steps.forEach((label, i)=>{
    const n = i+1;
    const active = state.patientStep >= n;
    html += '<div class="fp-step '+(active?'active':'')+'"><div class="fp-icon">'+n+'</div><div class="fp-label">'+label+'</div></div>';
    if(i < steps.length-1){
      html += '<div class="fp-line '+(state.patientStep > n ? 'active':'')+'"></div>';
    }
  });
  html += '</div>';
  return html;
}

/* ============ RENDER: PATIENT STEP 2 ============ */
function availableDates(){
  const today = todayStr(), maxD = maxDateStr();
  const openDates = [...new Set(
    slots.filter(s=>s.status==='open' && s.date>=today && s.date<=maxD).map(s=>s.date)
  )].sort();
  return openDates;
}
function slotsForDate(dateStr){
  return slots.filter(s=>s.status==='open' && s.date===dateStr).sort((a,b)=>a.time.localeCompare(b.time));
}

  let html = renderHeader();
  if(state.view === 'admin'){
    html += renderAdmin();
  } else if(state.view === 'lookup'){
    html += renderLookup();
  } else {
    if(state.patientStep===1) html += renderStep1();
    else if(state.patientStep===2) html += renderStep2();
    else html += renderStep3();
  }
  if(state.showAdminLogin){
    html += renderAdminLogin();
  }
  root.innerHTML = html;
  bindEvents();
}

// 進入後台：先載入資料立刻顯示畫面（不讓使用者等），
// 「補齊固定時段」改成背景執行，若真的有新增才悄悄重新整理畫面，
// 這樣登入後只需要等一次 Cloud Function 往返，而不是兩次。
async function enterAdmin(){
  state.view = 'admin';
  state.adminTab = 'slots';
  await loadAdminDashboard();
  render();
  regenerateTemplateOnServer().then(res=>{
    if(res && res.created > 0){
      loadAdminDashboard().then(render);
    }
  });
}

/* ============ EVENT BINDING ============ */
function bindEvents(){
  const gearBtn = document.getElementById('gearBtn');
  if(gearBtn) gearBtn.onclick = async ()=>{
    if(state.view==='admin'){ /* already in admin */ return; }
    if(auth.currentUser){
      // 已透過 Firebase Authentication 登入過，直接進入後台
      await enterAdmin();
    } else {
      state.showAdminLogin = true; render();
    }
  };

  // Admin login modal (Firebase Authentication)
  const pinCancel = document.getElementById('pinCancelBtn');
  if(pinCancel) pinCancel.onclick = ()=>{ state.showAdminLogin=false; render(); };
  const pinSubmit = document.getElementById('pinSubmitBtn');
  if(pinSubmit) pinSubmit.onclick = async ()=>{
    const passEl = document.getElementById('adminPasswordInput');
    const errEl = document.getElementById('pinError');
    const pass = passEl.value;
    errEl.style.display = 'none';
    if(!pass){
      errEl.textContent = '請輸入密碼';
      errEl.style.display = 'block';
      return;
    }
    pinSubmit.disabled = true;
    pinSubmit.textContent = '登入中…';
    try{
      await auth.signInWithEmailAndPassword(ADMIN_EMAIL, pass);
      state.showAdminLogin = false;
      await enterAdmin();
    }catch(e){
      console.error(e);
      errEl.textContent = '密碼錯誤，請再試一次';
      errEl.style.display = 'block';
      pinSubmit.disabled = false;
      pinSubmit.textContent = '登入';
    }
  };
  const passInput = document.getElementById('adminPasswordInput');
  if(passInput){
    passInput.focus();
    passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') pinSubmit.click(); });
  }

  if(state.view==='admin'){ bindAdminEvents(); return; }

  if(state.view==='lookup'){ bindLookupEvents(); return; }

  const gotoLookup = document.getElementById('gotoLookupBtn');
  if(gotoLookup) gotoLookup.onclick = ()=>{
    state.lookup = { name:'', birth:'', results:[], searched:false };
    state.view = 'lookup';
    render();
  };

  // ---- Patient step 1 ----
  if(state.patientStep===1){
    const nameEl = document.getElementById('f_name');
    const birthEl = document.getElementById('f_birth');
    const phoneEl = document.getElementById('f_phone');
    const issueEl = document.getElementById('f_issue');
    if(nameEl) nameEl.addEventListener('input', e=>{ state.form.name = e.target.value; });
    if(phoneEl) phoneEl.addEventListener('input', e=>{ state.form.phone = e.target.value; });
    if(issueEl) issueEl.addEventListener('input', e=>{ state.form.issue = e.target.value; });
    if(birthEl) birthEl.addEventListener('change', e=>{
      state.form.birth = e.target.value;
      if(state.form.birth && isOverAgeLimit(state.form.birth)){
        alert(AGE_LIMIT_MSG);
      }
      render();
    });
    const nextBtn = document.getElementById('toStep2Btn');
    if(nextBtn) nextBtn.onclick = ()=>{
      const f = state.form;
      if(!f.name.trim()){ showToast('請填寫兒童全名'); return; }
      if(!f.birth || !calcAge(f.birth)){ showToast('請選擇正確的兒童生日'); return; }
      if(isOverAgeLimit(f.birth)){ alert(AGE_LIMIT_MSG); return; }
      if(!f.phone.trim() || f.phone.replace(/\D/g,'').length < 8){ showToast('請填寫正確的聯絡電話'); return; }
      if(!f.issue.trim()){ showToast('請填寫主要問題'); return; }
      // 配額是否超過改成留到「確認預約」當下才由伺服器驗證，這裡不再呼叫雲端函式，
      // 讓下一步的畫面切換是即時的，不用等網路來回。
      state.waitlistMode = false;
      state.selectedDate = null;
      state.selectedSlotId = null;
      state.patientStep = 2;
      render();
    };
  }

  // ---- Patient step 2 ----
  if(state.patientStep===2){
    const backBtn = document.getElementById('backStep1Btn');
    if(backBtn) backBtn.onclick = ()=>{ state.patientStep=1; render(); };

    document.querySelectorAll('.date-chip').forEach(el=>{
      el.onclick = ()=>{ state.selectedDate = el.getAttribute('data-date'); state.selectedSlotId=null; render(); };
    });
    document.querySelectorAll('.time-btn').forEach(el=>{
      el.onclick = ()=>{ state.selectedSlotId = el.getAttribute('data-id'); render(); };
    });
    const toStep3 = document.getElementById('toStep3Btn');
    if(toStep3) toStep3.onclick = async ()=>{
      const slot = slots.find(s=>s.id===state.selectedSlotId);
      if(!slot){ showToast('請選擇時段'); return; }
      toStep3.disabled = true;
      toStep3.textContent = '處理中…';
      const f = state.form;
      try{
        const res = await fx.httpsCallable('bookSlot')({
          slotId: slot.id, name:f.name, birth:f.birth, phone:f.phone, issue:f.issue
        });
        slot.status = 'booked';
        state.bookingResult = { type:'booking', ...res.data };
        state.patientStep = 3;
        render();
      }catch(e){
        console.error(e);
        if(e.code === 'already-exists'){
          showToast('此時段已被預約，請重新選擇');
          await loadSlots();
          render();
        } else if(e.code === 'failed-precondition' && (e.message || '').includes('上限')){
          // 伺服器這時候才驗證出配額已滿：改切換到候補登記畫面，不用另外呼叫查詢配額的函式
          showToast(e.message || '此童已達兩次評估／門診機會上限，已為您改為候補登記');
          state.waitlistMode = true;
          state.selectedSlotId = null;
          render();
        } else if(e.code === 'failed-precondition'){
          showToast(e.message || '目前無法完成預約');
          toStep3.disabled = false;
          toStep3.textContent = '確認預約時段';
        } else {
          showToast('預約失敗，請重試');
          toStep3.disabled = false;
          toStep3.textContent = '確認預約時段';
        }
      }
    };

    const submitWait = document.getElementById('submitWaitlistBtn');
    if(submitWait) submitWait.onclick = async ()=>{
      const f = state.form;
      submitWait.disabled = true;
      submitWait.textContent = '送出中…';
      try{
        const res = await fx.httpsCallable('submitWaitlist')({
          name:f.name, birth:f.birth, phone:f.phone, issue:f.issue
        });
        state.bookingResult = { type:'waitlist', ...res.data };
        state.patientStep = 3;
        render();
      }catch(e){
        console.error(e);
        showToast('送出失敗，請重試');
        submitWait.disabled = false;
        submitWait.textContent = '送出候補登記';
      }
    };
  }

  // ---- Patient step 3 ----
  if(state.patientStep===3){
    const restartBtn = document.getElementById('restartBtn');
    if(restartBtn) restartBtn.onclick = ()=>{
      state.form = { name:'', birth:'', phone:'', issue:'' };
      state.selectedDate=null; state.selectedSlotId=null; state.bookingResult=null; state.waitlistMode=false;
      state.patientStep = 1;
      render();
    };
  }
}

function bindLookupEvents(){
  const nameEl = document.getElementById('lk_name');
  const birthEl = document.getElementById('lk_birth');
  if(nameEl) nameEl.addEventListener('input', e=>{ state.lookup.name = e.target.value; });
  if(birthEl) birthEl.addEventListener('change', e=>{ state.lookup.birth = e.target.value; });

  const backBtn = document.getElementById('backToBookBtn');
  if(backBtn) backBtn.onclick = ()=>{ state.view='patient'; state.patientStep=1; render(); };

  const searchBtn = document.getElementById('lookupSearchBtn');
  if(searchBtn) searchBtn.onclick = async ()=>{
    const lk = state.lookup;
    if(!lk.name.trim()){ showToast('請填寫兒童全名'); return; }
    if(!lk.birth){ showToast('請選擇兒童生日'); return; }
    searchBtn.disabled = true;
    searchBtn.textContent = '查詢中…';
    try{
      const res = await fx.httpsCallable('lookupMyBookings')({ name: lk.name, birth: lk.birth });
      lk.results = res.data.results;
      lk.searched = true;
    }catch(e){
      console.error(e);
      showToast('查詢失敗，請重試');
    }
    searchBtn.disabled = false;
    searchBtn.textContent = '查詢預約';
    render();
  };

  document.querySelectorAll('[data-cancel-own]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-cancel-own');
      if(!confirm('確定要取消此預約嗎？取消後時段將釋出，若之後仍有需要，請重新預約或登記候補。')) return;
      const lk = state.lookup;
      const booking = lk.results.find(b=>b.id===id);
      if(!booking) return;
      try{
        await fx.httpsCallable('cancelMyBooking')({ name: lk.name, birth: lk.birth, bookingId: id });
        showToast('已為您取消預約');
        lk.results = lk.results.filter(x=>x.id!==id);
        render();
      }catch(e){
        console.error(e);
        showToast('取消失敗，請重試');
      }
    };
  });
}

function bindAdminEvents(){
  const logoutBtn = document.getElementById('adminLogoutBtn');
  if(logoutBtn) logoutBtn.onclick = async ()=>{
    await auth.signOut();
    state.view='patient'; state.patientStep=1; render();
  };

  document.querySelectorAll('.tab-btn').forEach(el=>{
    el.onclick = async ()=>{
      const tab = el.getAttribute('data-tab');
      state.adminTab = tab;
      if(tab === 'audit'){
        await loadAuditLogs();
      }
      render();
    };
  });

  if(state.adminTab==='slots'){
    const regenBtn = document.getElementById('regenTemplateBtn');
    if(regenBtn) regenBtn.onclick = async ()=>{
      if(!confirm('確定要重新產生固定時段嗎？\n\n將會刪除「尚未被預約」的固定時段，並依樣板重新產生正確日期。\n已被預約的時段與手動加開的時段不會受影響。')) return;
      try{
        const res = await regenerateTemplateOnServer();
        await loadAdminDashboard();
        showToast(res.created > 0 ? `已重新產生固定時段（新增 ${res.created} 筆）` : '固定時段已是最新狀態');
        render();
      }catch(e){
        console.error(e);
        showToast('操作失敗，請重試');
      }
    };

    const dEl = document.getElementById('ns_date');
    const tEl = document.getElementById('ns_time');
    const nEl = document.getElementById('ns_note');
    if(dEl) dEl.addEventListener('change', e=>{ state.newSlot.date = e.target.value; });
    if(tEl) tEl.addEventListener('input', e=>{ state.newSlot.time = e.target.value; });
    if(nEl) nEl.addEventListener('input', e=>{ state.newSlot.note = e.target.value; });

    const addBtn = document.getElementById('addSlotBtn');
    if(addBtn) addBtn.onclick = async ()=>{
      const ns = state.newSlot;
      if(!ns.date){ showToast('請選擇日期'); return; }
      if(!/^\d{1,2}:\d{2}$/.test(ns.time.trim())){ showToast('請輸入正確時間格式，例如 09:30'); return; }
      try{
        const res = await fx.httpsCallable('adminAddSlot')({ date: ns.date, time: ns.time.trim(), note: ns.note.trim() });
        slots.push(res.data);
        state.newSlot = { date:'', time:'', note:'' };
        showToast('已新增時段');
        render();
      }catch(e){
        console.error(e);
        showToast('新增失敗，請重試');
      }
    };

    document.querySelectorAll('[data-delete-slot]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-delete-slot');
        if(!confirm('確定要刪除此時段嗎？')) return;
        try{
          await fx.httpsCallable('adminDeleteSlot')({ slotId: id });
          slots = slots.filter(s=>s.id!==id);
          showToast('已刪除時段');
          render();
        }catch(e){
          console.error(e);
          showToast('刪除失敗，請重試');
        }
      };
    });
    document.querySelectorAll('[data-cancel-booking]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-cancel-booking');
        const slot = slots.find(x=>x.id===id);
        if(!confirm('確定要取消此預約嗎？時段將釋出供其他人預約，請記得電話通知候補名單。')) return;
        try{
          await fx.httpsCallable('adminCancelBooking')({ slotId: id });
          if(slot){ slot.status='open'; delete slot.booking; }
          showToast('已取消預約，時段已釋出');
          render();
        }catch(e){
          console.error(e);
          showToast('操作失敗，請重試');
        }
      };
    });
    document.querySelectorAll('[data-restore-occ]').forEach(el=>{
      el.onclick = async ()=>{
        const key = el.getAttribute('data-restore-occ');
        try{
          await fx.httpsCallable('adminRestoreOccurrence')({ key });
          const res = await regenerateTemplateOnServer();
          await loadAdminDashboard();
          showToast(res.created > 0 ? '已恢復開放此時段' : '此時段目前已是開放狀態');
          render();
        }catch(e){
          console.error(e);
          showToast('操作失敗，請重試');
        }
      };
    });
  } else {
    document.querySelectorAll('[data-remove-wait]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-remove-wait');
        try{
          await fx.httpsCallable('adminRemoveWaitlistEntry')({ entryId: id });
          waitlist = waitlist.filter(w=>w.id!==id);
          render();
        }catch(e){
          console.error(e);
          showToast('刪除失敗，請重試');
        }
      };
    });
  }
}

/* ============ INIT ============ */
(async function init(){
  render(); // show loading
  await loadSlots();
  dataLoaded = true;
  render();
})();
</script>
